<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying your sign-in | CampGrids</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="workspacePage">
  <main class="adminAccessShell">
    <section class="authCard adminAccessCard" aria-labelledby="verificationTitle">
      <div class="formHeading">
        <p class="eyebrow">CampGrids secure sign-in</p>
        <h1 id="verificationTitle">Verifying your email</h1>
        <p id="verificationMessage">Completing your secure sign-in…</p>
      </div>
      <p id="verificationNotice" class="formNotice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="verify.js"></script>
</body>
</html>
