<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Browser setup for the homepage: character set, phone sizing, browser tab title, and the shared stylesheet. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampGrids | Museum of Science and Industry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-nav="home">
  <!-- This empty container is filled by site.js with the shared navigation bar used on every page. -->
  <div id="siteNav"></div>

  <!-- The homepage banner. It names the program and welcomes visitors in one line. -->
  <header class="siteHeader">
    <img class="headerLogo" src="assets/MSI_Logo.png" alt="Museum of Science and Industry logo">
    <div class="headerCopy">
      <p class="eyebrow">Museum of Science and Industry</p>
      <h1>Camps</h1>
      <p>Welcome to MSI Camps! Find your camp and explore the projects we have.</p>
    </div>
  </header>

  <!-- The camp list is the whole homepage. site.js fills it from the same camps list that builds the MSI Camps menu, so the two never disagree. -->
  <main class="pageMain homeMain">
    <section class="pageSection" aria-labelledby="campsTitle">
      <h2 id="campsTitle">Our Camps</h2>

      <!-- One full-width row per camp, filled by renderCampCards in site.js. -->
      <div class="campRows" id="campCards"></div>
    </section>
  </main>

  <!-- The closing line shared by every page on the site. -->
  <footer>
    <p>Camp Grids | Museum of Science and Industry</p>
  </footer>

  <!-- site.js builds the navigation bar and the camp rows above. -->
  <script src="site.js"></script>
</body>
</html>
