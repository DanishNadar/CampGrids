<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up your MSI account | MSI CampGrids</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#FE5000">
</head>
<body class="authPage">
  <!-- Destination for the Account activation email. password-setup.js reads the token type from
       the URL and refuses to run if it is the wrong kind, so an activation link
       cannot land on the recovery page or the other way round. -->
  <main class="adminAccessShell">
    <section class="authCard adminAccessCard" aria-labelledby="passwordSetupTitle">
      <div id="passwordSetupHost">
        <div class="formHeading">
          <p class="eyebrow">Account activation</p>
          <h1 id="passwordSetupTitle">Set up your MSI account</h1>
          <p>Checking your link&hellip;</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="password-setup.js" data-flow="account-setup"></script>
</body>
</html>
