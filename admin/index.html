<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSI administration</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/favicon-180.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#FE5000">
</head>
<body class="workspacePage">
  <main class="adminAccessShell">
    <section class="authCard adminAccessCard" aria-labelledby="adminTitle">
      <div class="formHeading"><p class="eyebrow">MSI personnel only</p><h1 id="adminTitle">Administration access</h1><p>Sign in with your administrator email and password, then enter the verification code sent to that email.</div>
      <form id="adminLoginForm" class="authPanel" method="post" novalidate>
        <label class="fieldLabel" data-admin-credential>Administrator email<input name="email" type="email" autocomplete="email" autocapitalize="none" required placeholder="name@example.org"></label>
        <label class="fieldLabel" data-admin-credential>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <div id="adminVerificationStep" class="stackForm" hidden>
          <label class="fieldLabel">Email verification code<input name="verificationCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" minlength="6" maxlength="8" placeholder="Verification code"></label>
          <div class="formActions"><button class="primaryButton" type="submit">Verify and enter administration</button><button id="adminResendCode" class="secondaryButton" type="button">Resend code</button><button id="adminStartOver" class="quietButton" type="button">Use a different account</button></div>
        </div>
        <button id="adminSendCode" class="primaryButton" type="submit">Send verification code</button>
        <p class="formHint" data-credential-hint>Forgotten your password? Enter your administrator email above, then click the following link to <button id="adminSetPassword" class="linkButton" type="button"> send a reset link.</button>.</p>
      </form>
      <p id="adminNotice" class="formNotice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-client.js"></script>
  <script src="../site.js"></script>
  <script src="/admin/admin-login.js"></script>
</body>
</html>
