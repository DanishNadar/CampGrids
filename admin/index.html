<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSI administration</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="workspacePage">
  <main class="adminAccessShell">
    <section class="authCard adminAccessCard" aria-labelledby="adminTitle">
      <div class="formHeading"><p class="eyebrow">MSI personnel only</p><h1 id="adminTitle">Administration access</h1><p>Sign in with your administrator email and password, then enter the verification code sent to that email.</p></div>
      <form id="adminLoginForm" class="authPanel" method="post" novalidate>
        <label class="fieldLabel" data-admin-credential>Administrator email<input name="email" type="email" autocomplete="email" autocapitalize="none" required placeholder="name@example.org"></label>
        <label class="fieldLabel" data-admin-credential>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <div id="adminVerificationStep" class="stackForm" hidden>
          <label class="fieldLabel">Email verification code<input name="verificationCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" minlength="6" maxlength="8" placeholder="Verification code"></label>
          <div class="formActions"><button class="primaryButton" type="submit">Verify and enter administration</button><button id="adminResendCode" class="secondaryButton" type="button">Resend code</button><button id="adminStartOver" class="quietButton" type="button">Use a different account</button></div>
        </div>
        <button id="adminSendCode" class="primaryButton" type="submit">Continue</button>
      </form>
      <p id="adminNotice" class="formNotice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-client.js"></script>
  <script src="/admin/admin-login.js"></script>
</body>
</html>
